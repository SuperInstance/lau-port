[package]
name = "lau-port"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-port"
description = "LAU Port — a protocol-agnostic connection layer for agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
